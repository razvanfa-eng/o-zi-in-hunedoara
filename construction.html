<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>O zi în județul Hunedoara — site în construcție</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:ital,wght@0,400;1,400&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #ece9e1;
    --surface:   #f6f4ee;
    --ink:       #201d18;
    --muted:     #5c5447;
    --border:    #cdc6b6;
    --accent:    #7e2e22;
    --forest:    #3c4a39;
    --serif: "Fraunces", "Playfair Display", Georgia, serif;
    --body:  "Newsreader", Georgia, serif;
    --sans:  "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #16140f;
      --surface: #201d15;
      --ink:     #eae6dc;
      --muted:   #a79e8b;
      --border:  #39332a;
      --accent:  #ce6a51;
      --forest:  #8fa681;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 1px 1px rgba(32,29,24,.04), 0 18px 40px -24px rgba(32,29,24,.35);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 28px;
  }
  .badge svg { width: 14px; height: 14px; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(28px, 5vw, 38px);
    line-height: 1.2;
    margin: 0 0 14px;
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }
  p {
    font-size: 17px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 auto;
    max-width: 420px;
  }
  .ornament {
    width: 60px;
    height: 2px;
    background: var(--forest);
    margin: 28px auto;
    border: none;
  }
  .site-name {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 32px;
  }
  .mascot-wrap {
    margin: 4px auto 8px;
    width: 220px;
  }
  .mascot-wrap svg { width: 100%; height: auto; overflow: visible; }
  .hammer-arm {
    transform-origin: 60px 120px;
    animation: hammer-strike 1.8s ease-in-out infinite;
  }
  @keyframes hammer-strike {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(-70deg); }
    32%  { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }
  .impact-burst {
    opacity: 0;
    animation: impact-flash 1.8s ease-in-out infinite;
    transform-origin: 34px 134px;
  }
  @keyframes impact-flash {
    0%, 15%, 27%, 100% { opacity: 0; transform: scale(.6); }
    19% { opacity: 1; transform: scale(1); }
    26% { opacity: 0; transform: scale(1.1); }
  }
  .plank {
    animation: plank-jolt 1.8s ease-in-out infinite;
    transform-origin: 57px 142px;
  }
  @keyframes plank-jolt {
    0%, 15%, 27%, 100% { transform: translateY(0); }
    19% { transform: translateY(2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hammer-arm, .impact-burst, .plank { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      Site în construcție
    </span>
    <div class="mascot-wrap" aria-hidden="true">
      <svg viewBox="0 0 235 170" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(15,0)">
          <g class="plank">
            <rect x="15" y="136" width="85" height="12" rx="3" fill="var(--border)"/>
            <rect x="15" y="136" width="85" height="3" rx="1.5" fill="var(--bg)" opacity=".5"/>
          </g>
          <g class="impact-burst" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round">
            <path d="M34,128 L34,120"/>
            <path d="M24,132 L17,126"/>
            <path d="M44,132 L51,126"/>
            <path d="M20,140 L12,140"/>
            <path d="M48,140 L56,140"/>
          </g>
          <g fill="none" stroke="var(--forest)" stroke-width="5" stroke-linecap="round">
            <path d="M98,132 C90,144 84,152 76,156"/>
            <path d="M114,134 C110,148 108,156 102,160"/>
            <path d="M130,132 C132,146 136,154 140,158"/>
            <path d="M146,126 C152,138 158,144 166,140"/>
          </g>
          <path d="M130,102 C167,93 186,68 178,44 C173,24 146,13 121,27" fill="none" stroke="var(--forest)" stroke-width="11" stroke-linecap="round"/>
          <polygon points="121,27 106,19 117,38" fill="var(--accent)"/>
          <path d="M55,118 C40,124 30,132 31,140 C32,145 38,147 44,144" fill="none" stroke="var(--forest)" stroke-width="7" stroke-linecap="round"/>
          <ellipse cx="100" cy="112" rx="37" ry="21" fill="var(--forest)"/>
          <circle cx="67" cy="107" r="17" fill="var(--forest)"/>
          <circle cx="61" cy="100" r="2.1" fill="var(--bg)"/>
          <circle cx="70" cy="97" r="2.1" fill="var(--bg)"/>
          <g class="hammer-arm">
            <path d="M60,120 C48,110 40,105 36,102" fill="none" stroke="var(--forest)" stroke-width="7" stroke-linecap="round"/>
            <g transform="translate(36,102) rotate(200)">
              <rect x="-3" y="0" width="6" height="46" rx="3" fill="#8a6a4a"/>
              <rect x="-17" y="38" width="34" height="20" rx="4" fill="var(--muted)"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <h1>Pregătim <em>o zi</em><br>în județul Hunedoara</h1>
    <p>Lucrăm la ghidul de călătorie prin Valea Jiului și împrejurimi. Revenim în curând cu locuri, itinerarii și povești din zonă.</p>
    <hr class="ornament">
    <div class="site-name">gohd.ro</div>
  </main>
</body>
</html>
