<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>O zi în județul Hunedoara — site în construcție</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:ital,wght@0,400;1,400&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #ece9e1;
    --surface:   #f6f4ee;
    --ink:       #201d18;
    --muted:     #5c5447;
    --border:    #cdc6b6;
    --accent:    #7e2e22;
    --forest:    #3c4a39;
    --serif: "Fraunces", "Playfair Display", Georgia, serif;
    --body:  "Newsreader", Georgia, serif;
    --sans:  "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #16140f;
      --surface: #201d15;
      --ink:     #eae6dc;
      --muted:   #a79e8b;
      --border:  #39332a;
      --accent:  #ce6a51;
      --forest:  #8fa681;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 1px 1px rgba(32,29,24,.04), 0 18px 40px -24px rgba(32,29,24,.35);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 28px;
  }
  .badge svg { width: 14px; height: 14px; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(28px, 5vw, 38px);
    line-height: 1.2;
    margin: 0 0 14px;
  }
  h1 em {
    font-style: italic;
    color: var(--accent);
  }
  p {
    font-size: 17px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 auto;
    max-width: 420px;
  }
  .ornament {
    width: 60px;
    height: 2px;
    background: var(--forest);
    margin: 28px auto;
    border: none;
  }
  .site-name {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 32px;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      Site în construcție
    </span>
    <h1>Pregătim <em>o zi</em><br>în județul Hunedoara</h1>
    <p>Lucrăm la ghidul de călătorie prin Valea Jiului și împrejurimi. Revenim în curând cu locuri, itinerarii și povești din zonă.</p>
    <hr class="ornament">
    <div class="site-name">gohd.ro</div>
  </main>
</body>
</html>
